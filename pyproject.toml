[project]
name = "rag-demo"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.2",
]

[project.optional-dependencies]
# Adaptadores de servicios externos. Opcionales a proposito: el nucleo
# y toda su suite de pruebas funcionan sin ellos.
servicios = [
    "redis>=5.0",
    "pika>=1.3",
    "minio>=7.2",
]

[project.scripts]
rag-demo = "rag_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_demo"]
