name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Se prueba el piso declarado en pyproject.toml y una version reciente.
    # fail-fast off: si una version falla, la otra igual reporta, para ver el
    # panorama completo en una sola corrida.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    name: pytest (Python ${{ matrix.python-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Instalar Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --frozen obliga a respetar uv.lock en lugar de resolver versiones
      # distintas a las probadas en local.
      - name: Instalar dependencias
        run: uv sync --frozen --dev

      # La suite completa corre sin red ni modelo: esa es la razon de que
      # Embedder y LanguageModel sean protocolos.
      - name: Ejecutar pruebas
        run: uv run pytest -v --junitxml=reporte-pruebas.xml

      # if: always() — sin esto el paso se saltaria justo cuando las pruebas
      # fallaron, que es cuando mas se necesita el reporte.
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas-py${{ matrix.python-version }}
          path: reporte-pruebas.xml

  # Construir la imagen es una prueba en si misma: verifica que el Dockerfile
  # sigue siendo valido y que el proyecto se instala desde cero en un entorno
  # limpio, sin nada heredado de la maquina de quien lo escribio.
  imagen:
    name: Construir imagen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Construir
        run: docker build -t rag-demo:ci .

      - name: Verificar que arranca
        run: docker run --rm rag-demo:ci rag-demo --help

      # El contenedor no debe correr como root: si alguien logra ejecutar algo
      # dentro, que no lo haga con privilegios.
      - name: Verificar que no corre como root
        run: |
          uid=$(docker run --rm rag-demo:ci id -u)
          test "$uid" != "0" || { echo "el contenedor corre como root"; exit 1; }
          echo "corre como uid $uid"

  # La interfaz se prueba y se construye aparte del backend: son dos artefactos
  # con dependencias distintas, y separarlos evita que un fallo de Node bloquee
  # el reporte de las pruebas de Python (y al reves).
  web:
    name: Interfaz Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci y no npm install: instala exactamente lo que fija el lockfile
      # y falla si no coincide con package.json, en lugar de resolver versiones
      # distintas a las probadas en local.
      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npx ng test --watch=false

      # Construir es una prueba en si misma: detecta errores de tipos y de
      # plantilla que las pruebas unitarias no necesariamente tocan.
      - name: Construir
        run: npx ng build
