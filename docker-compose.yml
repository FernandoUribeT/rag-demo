# Levanta el sistema completo con sus dependencias:
#
#   docker compose up -d
#   docker compose run --rm app rag-demo "¿cuándo se requiere Carta Porte?"
#
# Ollama queda fuera a propósito: el modelo pesa varios GB y normalmente ya
# corre en la máquina del desarrollador. El contenedor lo alcanza por
# host.docker.internal.

services:
  redis:
    image: redis:7-alpine
    # appendonly: la caché sobrevive un reinicio. No es obligatorio —una caché
    # vacía solo significa recalcular— pero recalcular embeddings cuesta caro.
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # protocolo
      - "15672:15672"  # consola web: usuario y contraseña guest
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # API S3
      - "9001:9001"    # consola web
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  app:
    build: .
    # depends_on con condition: service_healthy — sin esto el contenedor
    # arranca en cuanto el proceso existe, no en cuanto responde, y falla al
    # conectarse con dependencias que todavía no terminaron de iniciar.
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      MINIO_ENDPOINT: minio:9000
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  redis-data:
  rabbitmq-data:
  minio-data:
